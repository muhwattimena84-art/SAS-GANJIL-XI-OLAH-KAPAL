<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAS Ganjil - Olah Gerak Kapal Pengendali NKPI | SMK Waliwa Laimu</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & VARIABEL TEMA MARITIM (NAVY BLUE, SEA BLUE, WHITE, GOLD)
       ========================================================================== */
    :root {
      --navy-950: #050d1a;
      --navy-900: #0a192f;
      --navy-800: #112240;
      --navy-700: #1d3557;
      --navy-600: #27496d;
      --sea-700: #0369a1;
      --sea-600: #0284c7;
      --sea-500: #0ea5e9;
      --sea-100: #e0f2fe;
      --sea-50: #f0f9ff;
      --gold-700: #b45309;
      --gold-600: #d97706;
      --gold-500: #f59e0b;
      --gold-400: #fbbf24;
      --gold-100: #fef3c7;
      --gold-50: #fffbeb;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --success-600: #16a34a;
      --success-100: #dcfce7;
      --warning-600: #d97706;
      --warning-100: #fef3c7;
      --danger-600: #dc2626;
      --danger-100: #fee2e2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --shadow-sm: 0 1px 3px rgba(10, 25, 47, 0.08);
      --shadow-md: 0 4px 14px rgba(10, 25, 47, 0.1);
      --shadow-lg: 0 12px 30px rgba(10, 25, 47, 0.16);
      --sidebar-width: 270px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", Times, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background-color: var(--slate-100);
      color: var(--slate-800);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. LAYOUT UTAMA (SIDEBAR DESKTOP + HEADER RESPONSIF MOBILE)
       ========================================================================== */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-800) 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      border-right: 1px solid rgba(251, 191, 36, 0.2);
      transition: transform 0.3s ease;
    }

    .sidebar-brand {
      padding: 20px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(5, 13, 26, 0.45);
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-700));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
      color: var(--navy-950);
    }

    .brand-text h1 {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--gold-400);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.74rem;
      color: var(--slate-300);
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-section-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--slate-400);
      padding: 10px 12px 4px;
      font-weight: 700;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--slate-200);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-btn:hover {
      background: rgba(14, 165, 233, 0.14);
      color: var(--white);
    }

    .nav-btn.active {
      background: linear-gradient(90deg, rgba(2, 132, 199, 0.35), rgba(14, 165, 233, 0.12));
      color: var(--gold-400);
      border-left: 4px solid var(--gold-400);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold-400);
      font-weight: 700;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(5, 13, 26, 0.5);
      font-size: 0.76rem;
      color: var(--slate-300);
    }

    .offline-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.2);
      color: #4ade80;
      font-weight: 700;
      font-size: 0.72rem;
      margin-bottom: 6px;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: var(--shadow-sm);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--navy-900);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      cursor: pointer;
    }

    .topbar-title h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .topbar-title span {
      font-size: 0.78rem;
      color: var(--slate-500);
      display: block;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .role-badge.student {
      background: var(--sea-100);
      color: var(--sea-700);
    }

    .role-badge.teacher {
      background: var(--gold-100);
      color: var(--gold-700);
      border: 1px solid var(--gold-400);
    }

    .content-area {
      padding: 24px;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 13, 26, 0.65);
      z-index: 35;
      backdrop-filter: blur(2px);
    }

    .sidebar-overlay.show {
      display: block;
    }

    /* ==========================================================================
       3. KOMPONEN UI UMUM (CARDS, BUTTONS, TABLES, BADGES, FORMS)
       ========================================================================== */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-200);
      padding: 22px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--slate-200);
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--navy-900);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-maritime {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 55%, var(--sea-700) 100%);
      color: var(--white);
      border-radius: var(--radius-xl);
      padding: 28px 30px;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .hero-wave-bg {
      position: absolute;
      right: -20px;
      bottom: -20px;
      opacity: 0.12;
      pointer-events: none;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(251, 191, 36, 0.18);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: var(--gold-400);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .hero-maritime h1 {
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .hero-maritime p {
      color: var(--slate-200);
      font-size: 0.96rem;
      max-width: 780px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      min-height: 44px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--sea-600), var(--navy-700));
      color: var(--white);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.28);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.38);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
      color: var(--navy-950);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
      transform: translateY(-1px);
    }

    .btn-navy {
      background: var(--navy-900);
      color: var(--white);
    }

    .btn-navy:hover:not(:disabled) {
      background: var(--navy-800);
    }

    .btn-outline {
      background: var(--white);
      color: var(--navy-900);
      border: 1.5px solid var(--slate-300);
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--sea-600);
      color: var(--sea-600);
      background: var(--sea-50);
    }

    .btn-danger {
      background: var(--danger-600);
      color: var(--white);
    }

    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .btn-success {
      background: var(--success-600);
      color: var(--white);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.8rem;
      min-height: 36px;
      border-radius: var(--radius-sm);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .info-item {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--slate-500);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-md);
      font-size: 0.94rem;
      font-family: inherit;
      color: var(--slate-900);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--sea-600);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--slate-200);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead {
      background: var(--navy-900);
      color: var(--white);
    }

    th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 700;
      white-space: nowrap;
    }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--slate-200);
      vertical-align: top;
    }

    tbody tr:hover {
      background: var(--slate-50);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-navy { background: var(--navy-900); color: var(--gold-400); }
    .badge-sea { background: var(--sea-100); color: var(--sea-700); }
    .badge-gold { background: var(--gold-100); color: var(--gold-700); }
    .badge-success { background: var(--success-100); color: var(--success-600); }
    .badge-warning { background: var(--warning-100); color: var(--warning-600); }
    .badge-danger { background: var(--danger-100); color: var(--danger-600); }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-info h4 {
      font-size: 0.78rem;
      color: var(--slate-500);
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-info .stat-num {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.2;
    }

    /* ==========================================================================
       4. HALAMAN UJIAN INTERAKTIF (CBT INTERFACE - NAVIGASI SOAL DI KANAN)
       ========================================================================== */
    .exam-header-bar {
      background: var(--navy-900);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .timer-box.urgent {
      background: rgba(220, 38, 38, 0.28);
      border-color: #f87171;
      animation: pulseWarn 1s infinite alternate;
    }

    @keyframes pulseWarn {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .timer-digits {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--gold-400);
    }

    .exam-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    .question-box {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--slate-200);
    }

    .question-text {
      font-size: 1.05rem;
      color: var(--slate-900);
      font-weight: 600;
      margin-bottom: 22px;
      line-height: 1.65;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid var(--slate-200);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.18s ease;
      background: var(--white);
    }

    .option-card:hover {
      border-color: var(--sea-500);
      background: var(--sea-50);
    }

    .option-card.selected {
      border-color: var(--navy-900);
      background: var(--sea-100);
      box-shadow: 0 2px 8px rgba(10, 25, 47, 0.08);
    }

    .option-letter {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--slate-100);
      color: var(--navy-900);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1.5px solid var(--slate-300);
    }

    .option-card.selected .option-letter {
      background: var(--navy-900);
      color: var(--gold-400);
      border-color: var(--navy-900);
    }

    .option-text {
      padding-top: 4px;
      font-size: 0.96rem;
      color: var(--slate-800);
    }

    .exam-nav-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--slate-200);
    }

    .nav-grid-panel {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 82px;
      width: 100%;
    }

    .q-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .q-num-btn {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--slate-300);
      background: var(--white);
      color: var(--slate-700);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .q-num-btn.answered {
      background: var(--success-600);
      color: var(--white);
      border-color: var(--success-600);
    }

    .q-num-btn.flagged {
      background: var(--gold-500);
      color: var(--navy-950);
      border-color: var(--gold-600);
    }

    .q-num-btn.current {
      outline: 3px solid var(--sea-500);
      outline-offset: 1px;
      transform: scale(1.05);
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--slate-600);
      padding-top: 10px;
      border-top: 1px solid var(--slate-200);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    /* ==========================================================================
       5. TABS & SUB-NAVIGASI
       ========================================================================== */
    .tabs-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      border-bottom: 2px solid var(--slate-200);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: var(--slate-100);
      color: var(--slate-700);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--navy-900);

            } catch (e) {
              // Lanjut ke resolve
            }
          }
          resolve(true);
        });
      }
    };

    /* ========================================================================
       C. STATE APLIKASI & INISIALISASI
       ======================================================================== */
    const AppState = {
      currentPage: "beranda",
      isTeacherAuthenticated: false,
      settings: Object.assign({}, DEFAULT_SETTINGS),
      questions: [],
      registeredStudents: [],
      submissions: [],
      activeSession: null,
      examStep: 1, // 1=Identitas, 2=Konfirmasi, 3=Pengerjaan, 4=Konfirmasi Selesai, 5=Hasil
      currentQuestionIdx: 0,
      timerInterval: null,
      teacherTab: "overview",
      selectedCertSubmissionId: null
    };

    async function initApp() {
      try {
        await OfflineDB.init();

        const savedSettings = await OfflineDB.getState("settings");
        if (savedSettings) {
          AppState.settings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);
          let settingsUpdated = false;
          if (AppState.settings.teacherPin === "2026") {
            AppState.settings.teacherPin = "smk@1234";
            settingsUpdated = true;
          }
          if (AppState.settings.durationMinutes === 90) {
            AppState.settings.durationMinutes = 120;
            settingsUpdated = true;
          }
          if (AppState.settings.kktp === undefined) {
            AppState.settings.kktp = 75;
            settingsUpdated = true;
          }
          if (!AppState.settings.examDate) {
            AppState.settings.examDate = "Selasa, 01 Desember 2026";
            settingsUpdated = true;
          }
          if (!AppState.settings.principalName || AppState.settings.principalName === "Kepala SMK Waliwa Laimu") {
            AppState.settings.principalTitle = "Kepala Sekolah SMK Waliwa Laimu";
            AppState.settings.principalName = "Mahmud Wattimury, M.Pd";
            settingsUpdated = true;
          }
          if (settingsUpdated) {
            await OfflineDB.setState("settings", AppState.settings);
          }
        } else {
          await OfflineDB.setState("settings", AppState.settings);
        }

        const savedQuestions = await OfflineDB.getState("questions");
        if (savedQuestions && Array.isArray(savedQuestions) && savedQuestions.length > 0) {
          AppState.questions = savedQuestions;
        } else {
          AppState.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
          await OfflineDB.setState("questions", AppState.questions);
        }

        const savedRoster = await OfflineDB.getState("registeredStudents");
        if (savedRoster && Array.isArray(savedRoster)) {
          AppState.registeredStudents = savedRoster;
        }

        AppState.submissions = await OfflineDB.getAllSubmissions();

        // Pulihkan sesi ujian aktif jika halaman tidak sengaja dimuat ulang
        const savedSession = await OfflineDB.getState("activeSession");
        if (savedSession && savedSession.status === "in_progress") {
          AppState.activeSession = savedSession;
          AppState.examStep = 3;
          AppState.currentPage = "ujian";
          startExamTimer();
          showToast("Sesi ujian aktif dipulihkan otomatis dari penyimpanan lokal.", "success");
        }

        setupExamSecurityListeners();
        updateHeaderAndSidebarUI();
        renderCurrentPage();
        if (AppState.activeSession && AppState.activeSession.status === "in_progress" && AppState.activeSession.isScreenLocked) {
          renderExamLockOverlay();
        }
      } catch (err) {
        console.error("Gagal menginisialisasi aplikasi:", err);
        AppState.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
        renderCurrentPage();
      }
    }

    /* ========================================================================
       D. KEAMANAN & KETERTIBAN UJIAN REALISTIS (PERINGATAN 1X & KUNCI LAYAR)
       ======================================================================== */
    function setupExamSecurityListeners() {
      document.addEventListener("visibilitychange", function() {
        if (document.hidden && AppState.activeSession && AppState.activeSession.status === "in_progress") {
          triggerExamScreenLock("Peserta berpindah tab, meminimalkan layar, atau meninggalkan tampilan aplikasi ujian.");
        }
      });

      window.addEventListener("beforeunload", function(e) {
        if (AppState.activeSession && AppState.activeSession.status === "in_progress") {
          e.preventDefault();
          e.returnValue = "Sesi ujian masih berlangsung. Jawaban Anda tersimpan otomatis.";
        }
      });
    }

    async function triggerExamScreenLock(reasonText) {
      const session = AppState.activeSession;
      if (!session || session.status !== "in_progress") return;

      const now = Date.now();
      if (session.lastExitAt && (now - session.lastExitAt) < 800) {
        return;
      }
      session.lastExitAt = now;

      const timestamp = new Date(now).toLocaleTimeString("id-ID");
      session.tabSwitchCount = (session.tabSwitchCount || 0) + 1;
      session.isScreenLocked = true;

      if (!session.singleWarningShown) {
        // Peringatan pertama dan satu-satunya (1x) dengan mengunci layar ujian otomatis
        session.singleWarningShown = true;
        session.requiresTeacherUnlock = false;
        session.activityLogs.push("[" + timestamp + "] PERINGATAN 1x (Layar Dikunci Otomatis): " + reasonText);
      } else {
        // Sudah pernah mendapat peringatan 1x -> kunci layar ujian secara penuh (wajib password guru)
        session.requiresTeacherUnlock = true;
        session.activityLogs.push("[" + timestamp + "] KUNCI PENGAMAN (" + session.tabSwitchCount + "x): Peserta kembali keluar dari layar ujian setelah peringatan 1x. " + reasonText);
      }

      await OfflineDB.setState("activeSession", session);
      renderExamLockOverlay();
    }

    function renderExamLockOverlay() {
      const overlay = document.getElementById("examLockOverlay");
      const session = AppState.activeSession;
      if (!overlay || !session || session.status !== "in_progress" || !session.isScreenLocked) {
        if (overlay) {
          overlay.classList.remove("active");
          overlay.innerHTML = "";
        }
        return;
      }

      const isHardLocked = !!session.requiresTeacherUnlock;
      const headerBg = isHardLocked ? "var(--danger-600)" : "var(--navy-900)";
      const badgeText = isHardLocked ? "KUNCI LAYAR PENGAWAS • PELANGGARAN BERULANG" : "PERINGATAN KETERTIBAN UJIAN (1 KALI)";
      const titleText = isHardLocked ? "Layar Ujian Terkunci Permanen" : "Peringatan: Layar Ujian Dikunci Otomatis";

      const actionSection = !isHardLocked
        ? '' +
          '<div style="background: var(--gold-50); border: 1.5px solid var(--gold-500); border-radius: var(--radius-md); padding: 14px; margin-bottom: 18px; text-align: left; font-size: 0.88rem; color: var(--navy-950);">' +
          '  <strong>Perhatian Penting (Peringatan Satu Kali):</strong><br>' +
          '  Sistem mendeteksi Anda keluar dari tampilan layar ujian dan telah <strong>mengunci layar ujian secara otomatis</strong>. ' +
          '  Ini adalah <strong>peringatan satu-satunya</strong>. Jika Anda kembali keluar dari layar ujian setelah ini, layar akan dikunci penuh dan hanya dapat dibuka oleh Guru Pengawas.' +
          '</div>' +
          '<button type="button" class="btn btn-gold" style="width: 100%; font-size: 0.96rem;" onclick="acknowledgeSingleExamWarning()">' +
          '  Saya Mengerti & Buka Kunci Layar Ujian' +
          '</button>'
        : '' +
          '<div style="background: var(--danger-100); border: 1.5px solid var(--danger-600); border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px; text-align: left; font-size: 0.88rem; color: var(--slate-900);">' +
          '  <strong>Batas Peringatan 1 Kali Telah Digunakan:</strong><br>' +
          '  Anda terdeteksi kembali keluar dari tampilan layar ujian. Sesuai tata tertib asesmen, layar ujian dikunci secara otomatis dan memerlukan otorisasi <strong>Guru Pengawas</strong> untuk membukanya.' +
          '</div>' +
          '<div class="form-group" style="text-align: left;">' +
          '  <label class="form-label" for="lockTeacherPinInput">Password Guru Pengawas (Untuk Membuka Kunci)</label>' +
          '  <input type="password" id="lockTeacherPinInput" class="form-control" placeholder="Masukkan password guru pengawas..." autocomplete="off" />' +
          '</div>' +
          '<div style="display: flex; flex-direction: column; gap: 10px;">' +
          '  <button type="button" class="btn btn-navy" style="width: 100%;" onclick="unlockExamScreenByTeacher()">Buka Kunci Layar Ujian (Otorisasi Guru)</button>' +
          '  <button type="button" class="btn btn-outline btn-sm" style="width: 100%;" onclick="finalizeExamSubmission(false)">Kumpulkan & Akhiri Ujian Sekarang</button>' +
          '</div>';

      overlay.innerHTML = '' +
        '<div class="exam-lock-card">' +
        '  <div style="background: ' + headerBg + '; color: var(--white); padding: 20px 24px; text-align: center; border-bottom: 3px solid var(--gold-500);">' +
        '    <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.14); color: var(--gold-400); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;">' +
        '      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>' +
        '    </div>' +
        '    <div style="font-size: 0.72rem; letter-spacing: 1px; font-weight: 800; color: var(--gold-400); text-transform: uppercase;">' + badgeText + '</div>' +
        '    <h3 style="font-size: 1.25rem; font-weight: 800; margin-top: 4px;">' + titleText + '</h3>' +
        '  </div>' +

        '    <div style="font-size: 0.86rem; color: var(--slate-600); margin-bottom: 14px;">' +
        '      Peserta: <strong>' + escapeHTML(session.student.fullName) + '</strong> (' + escapeHTML(session.student.participantNumber) + ') • Tercatat Keluar Layar: <strong>' + session.tabSwitchCount + 'x</strong>' +
        '    </div>' +
        '    ' + actionSection +
        '  </div>' +
        '</div>';

      overlay.classList.add("active");
    }

    function hideExamLockOverlay() {
      const overlay = document.getElementById("examLockOverlay");
      if (overlay) {
        overlay.classList.remove("active");
        overlay.innerHTML = "";
      }
    }

    async function acknowledgeSingleExamWarning() {
      const session = AppState.activeSession;
      if (!session || session.requiresTeacherUnlock) return;
      session.isScreenLocked = false;
      session.activityLogs.push("[" + new Date().toLocaleTimeString("id-ID") + "] Peserta menyetujui peringatan 1x dan membuka kunci layar ujian.");
      await OfflineDB.setState("activeSession", session);
      hideExamLockOverlay();
    }

    async function unlockExamScreenByTeacher() {
      const session = AppState.activeSession;
      if (!session) return;
      const inp = document.getElementById("lockTeacherPinInput");
      const val = inp ? inp.value.trim() : "";
      if (val === AppState.settings.teacherPin) {
        session.isScreenLocked = false;
        session.requiresTeacherUnlock = false;
        session.activityLogs.push("[" + new Date().toLocaleTimeString("id-ID") + "] Guru Pengawas membuka kunci layar ujian.");
        await OfflineDB.setState("activeSession", session);
        hideExamLockOverlay();
        showToast("Layar ujian berhasil dibuka kembali oleh Guru Pengawas.", "success");
      } else {
        showToast("Password Guru Pengawas tidak sesuai.", "danger");
      }
    }

    /* ========================================================================
       E. NAVIGASI & OTENTIKASI GURU
       ======================================================================== */
    function toggleMobileSidebar(open) {
      const sb = document.getElementById("sidebar");
      const ov = document.getElementById("sidebarOverlay");
      if (!sb || !ov) return;
      if (open) {
        sb.classList.add("open");
        ov.classList.add("show");
      } else {
        sb.classList.remove("open");
        ov.classList.remove("show");
      }
    }

    function navigateTo(page) {
      if (AppState.activeSession && AppState.activeSession.status === "in_progress" && page !== "ujian") {
        toggleMobileSidebar(false);
        triggerExamScreenLock("Peserta mencoba keluar dari layar ujian menuju menu " + page.toUpperCase() + ".");
        return;
      }

      if ((page === "guru" || page === "admin") && !AppState.isTeacherAuthenticated) {
        promptTeacherLogin(page);
        return;
      }

      AppState.currentPage = page;
      toggleMobileSidebar(false);
      updateHeaderAndSidebarUI();
      renderCurrentPage();
    }

    function promptTeacherLogin(targetPage) {
      const bodyHtml = '' +
        '<p style="margin-bottom: 14px; color: var(--slate-600); font-size: 0.92rem;">' +
        'Area ini dilindungi khusus untuk Guru Mata Pelajaran (<strong>' + escapeHTML(AppState.settings.teacherName) + '</strong>) guna menjaga kerahasiaan kunci jawaban, rubrik penilaian, dan pengaturan asesmen.' +
        '</p>' +
        '<div class="form-group">' +
        '<label class="form-label" for="pinInput">Masukkan Password Guru / Admin</label>' +
        '<input type="password" id="pinInput" class="form-control" placeholder="Masukkan password akses..." autocomplete="off" />' +
        '</div>';

      const footerHtml = '' +
        '<button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>' +
        '<button type="button" class="btn btn-navy" onclick="verifyTeacherPin(\'' + targetPage + '\')">Masuk Mode Guru</button>';

      openModal("Verifikasi Akses Guru / Admin", bodyHtml, footerHtml);
      setTimeout(function() {
        const inp = document.getElementById("pinInput");
        if (inp) {
          inp.focus();
          inp.addEventListener("keydown", function(e) {
            if (e.key === "Enter") verifyTeacherPin(targetPage);
          });
        }
      }, 60);
    }

    function verifyTeacherPin(targetPage) {
      const inp = document.getElementById("pinInput");
      const val = inp ? inp.value.trim() : "";
      if (val === AppState.settings.teacherPin) {
        AppState.isTeacherAuthenticated = true;
        closeModal();
        showToast("Berhasil masuk ke Mode Guru / Admin.", "success");
        AppState.currentPage = targetPage;
        toggleMobileSidebar(false);
        updateHeaderAndSidebarUI();
        renderCurrentPage();
      } else {
        showToast("Password yang Anda masukkan salah.", "danger");
      }
    }

    function handleTeacherAuthToggle() {
      if (AppState.isTeacherAuthenticated) {
        AppState.isTeacherAuthenticated = false;
        if (AppState.currentPage === "guru" || AppState.currentPage === "admin") {
          AppState.currentPage = "beranda";
        }
        updateHeaderAndSidebarUI();
        renderCurrentPage();
        showToast("Anda telah keluar dari Mode Guru.", "warning");
      } else {
        promptTeacherLogin("guru");
      }
    }

    function updateHeaderAndSidebarUI() {
      const titles = {
        beranda: "BERANDA ASESMEN SUMATIF",

      const titleEl = document.getElementById("topbarPageTitle");
      const subEl = document.getElementById("topbarSubtitle");
      const examBadge = document.getElementById("navExamBadge");
      if (titleEl) titleEl.textContent = titles[AppState.currentPage] || "SAS GANJIL NKPI";
      if (subEl) subEl.textContent = AppState.settings.subjectName + " • " + AppState.settings.schoolName;
      if (examBadge) examBadge.textContent = AppState.questions.length + " Soal";

      document.querySelectorAll(".nav-btn").forEach(function(btn) {
        if (btn.getAttribute("data-page") === AppState.currentPage) {
          btn.classList.add("active");

          btn.classList.remove("active");

      });

      const authBtn = document.getElementById("teacherAuthBtn");

      if (roleBadge && authBtn && lockBadge) {

          roleBadge.className = "role-badge teacher";
          roleBadge.textContent = "Mode Guru Aktif";
          authBtn.textContent = "Keluar Mode Guru";
          lockBadge.textContent = "AKTIF";
        } else {
          roleBadge.className = "role-badge student";
          roleBadge.textContent = "Mode Peserta Didik";
          authBtn.textContent = "Masuk Mode Guru";
          lockBadge.textContent = "KUNCI";
        }
      }
    }

    function renderCurrentPage() {
      const container = document.getElementById("mainContent");
      if (!container) return;
      switch (AppState.currentPage) {
        case "beranda":
          renderBeranda(container);
          break;
        case "ujian":
          renderUjian(container);
          break;
        case "hasil":
          renderHasil(container);
          break;
        case "sertifikat":
          renderSertifikat(container);
          break;
        case "guru":
          renderDashboardGuru(container);
          break;
        case "admin":
          renderAdmin(container);
          break;
        default:
          renderBeranda(container);
      }
    }

    function renderUjian(container) {
      if (AppState.activeSession && AppState.activeSession.status === "in_progress" && AppState.examStep < 3) {
        AppState.examStep = 3;
      }

      if (AppState.examStep === 1) {
        renderExamIdentityStep(container);
      } else if (AppState.examStep === 2) {
        renderExamConfirmationStep(container);
      } else if (AppState.examStep === 3) {
        renderExamWorkspaceStep(container);
      } else if (AppState.examStep === 4) {
        renderExamFinishConfirmStep(container);
      } else if (AppState.examStep === 5) {
        renderExamResultStep(container);
      }
    }

    function submitStudentIdentity(e) {
      e.preventDefault();
      const fullName = document.getElementById("stuFullName").value.trim();
      const nisn = document.getElementById("stuNisn").value.trim();
      const participantNumber = document.getElementById("stuParticipantNo").value.trim();
      const className = document.getElementById("stuClass").value.trim();

      if (!fullName || !nisn || !participantNumber || !className) {
        showToast("Harap lengkapi seluruh kolom identitas peserta.", "danger");
        return;
      }

      if (AppState.registeredStudents.length > 0) {
        const found = AppState.registeredStudents.find(function(st) {
          return st.participantNumber.toLowerCase() === participantNumber.toLowerCase() || st.nisn === nisn;
        });
        if (!found) {
          showToast("Nomor Peserta / NISN tidak terdaftar pada daftar peserta yang diatur guru.", "danger");
          return;
        }
      }

      const existingCompleted = AppState.submissions.find(function(sub) {
        return (sub.student.participantNumber.toLowerCase() === participantNumber.toLowerCase() || sub.student.nisn === nisn) && !sub.allowRetake;
      });

      if (existingCompleted) {
        showModal(
          "Sesi Ujian Sudah Selesai",
          '<p style="color: var(--slate-700); margin-bottom: 12px;">Peserta atas nama <strong>' + escapeHTML(existingCompleted.student.fullName) + '</strong> (' + escapeHTML(existingCompleted.student.participantNumber) + ') sudah menyelesaikan ujian ini.</p>' +
          '<p style="color: var(--slate-600); font-size: 0.9rem;">Sesuai tata tertib asesmen, setiap peserta hanya memiliki 1 kali kesempatan mengerjakan ujian kecuali Guru mengaktifkan izin ulang ujian pada menu Admin.</p>',
          '<button type="button" class="btn btn-outline" onclick="closeModal()">Tutup</button>' +
          '<button type="button" class="btn btn-primary" onclick="closeModal(); navigateTo(\'hasil\')">Lihat Hasil Peserta</button>'
        );
        return;
      }

      AppState.activeSession = {
        id: "SES-" + Date.now(),
        student: { fullName: fullName, nisn: nisn, className: className, participantNumber: participantNumber },
        status: "pending_confirm",
        answers: {},
        flagged: {},
        startedAt: null,
        endTimeMs: null,
        tabSwitchCount: 0,
        activityLogs: []
      };

      AppState.examStep = 2;
      renderCurrentPage();
    }

    async function beginActiveExam() {
      const check = document.getElementById("agreeHonestyCheck");
      if (!check || !check.checked) {
        showToast("Silakan centang persetujuan pernyataan mengerjakan ujian secara mandiri.", "warning");
        return;
      }

      const now = Date.now();
      const durationMs = AppState.settings.durationMinutes * 60 * 1000;
      AppState.activeSession.status = "in_progress";
      AppState.activeSession.startedAt = new Date(now).toISOString();
      AppState.activeSession.endTimeMs = now + durationMs;
      AppState.activeSession.isScreenLocked = false;
      AppState.activeSession.singleWarningShown = false;
      AppState.activeSession.requiresTeacherUnlock = false;
      AppState.activeSession.lastExitAt = 0;
      AppState.activeSession.activityLogs.push("[" + new Date(now).toLocaleTimeString("id-ID") + "] Sesi ujian dimulai. Identitas peserta dikunci.");

      await OfflineDB.setState("activeSession", AppState.activeSession);
      AppState.currentQuestionIdx = 0;
      AppState.examStep = 3;
      startExamTimer();
      renderCurrentPage();
      showToast("Waktu ujian dimulai! Selamat mengerjakan.", "success");
    }

    function startExamTimer() {
      if (AppState.timerInterval) clearInterval(AppState.timerInterval);
      AppState.timerInterval = setInterval(function() {
        if (!AppState.activeSession || AppState.activeSession.status !== "in_progress") {
          clearInterval(AppState.timerInterval);
          return;
        }
        const remainingMs = AppState.activeSession.endTimeMs - Date.now();
        if (remainingMs <= 0) {
          clearInterval(AppState.timerInterval);
          showToast("Waktu ujian telah habis! Jawaban dikumpulkan secara otomatis.", "danger");
          finalizeExamSubmission(true);
          return;
        }
        const timerEl = document.getElementById("examTimerDisplay");
        const boxEl = document.getElementById("examTimerBox");
        if (timerEl) {
          timerEl.textContent = formatCountdown(remainingMs);
        }
        if (boxEl && remainingMs <= 5 * 60 * 1000) {
          boxEl.classList.add("urgent");
        }
      }, 1000);
    }

    function renderExamWorkspaceStep(container) {
      const session = AppState.activeSession;
      const qList = AppState.questions;
      const idx = AppState.currentQuestionIdx;
      const q = qList[idx];

      if (!q) {
        AppState.currentQuestionIdx = 0;
        renderCurrentPage();
        return;
      }

      const remainingMs = Math.max(0, session.endTimeMs - Date.now());
      const isFlagged = !!session.flagged[q.id];
      const currentAns = session.answers[q.id];

      let answeredCount = 0;
      let flaggedCount = 0;
      qList.forEach(function(item) {
        const val = session.answers[item.id];
        if (val !== undefined && val !== null && String(val).trim() !== "") answeredCount++;
        if (session.flagged[item.id]) flaggedCount++;
      });
      const unansweredCount = qList.length - answeredCount;

      let answerInputHtml = "";
      if (q.type === "PG") {
        const letters = ["A", "B", "C", "D", "E"];
        let cards = "";
        q.options.forEach(function(optText, optIdx) {
          const isSelected = currentAns === optIdx;
          cards += '' +
            '<div class="option-card ' + (isSelected ? "selected" : "") + '" onclick="selectPgAnswer(' + q.id + ', ' + optIdx + ')" role="button" tabindex="0">' +
            '  <div class="option-letter">' + letters[optIdx] + '</div>' +
            '  <div class="option-text">' + escapeHTML(optText) + '</div>' +
            '</div>';
        });
        answerInputHtml = '<div class="option-list">' + cards + '</div>';
      } else {
        const textVal = currentAns ? escapeHTML(String(currentAns)) : "";
        answerInputHtml = '' +
          '<div class="form-group">' +
          '  <label class="form-label" for="essayAnswerBox">Jawaban Uraian / Essay Anda (Tersimpan Otomatis):</label>' +
          '  <textarea id="essayAnswerBox" class="form-control" rows="7" placeholder="Tuliskan penjelasan, analisis, atau langkah prosedur teknis secara lengkap dan sistematis..." oninput="saveEssayAnswer(' + q.id + ', this.value)">' + textVal + '</textarea>' +
          '</div>';
      }

      let navGridButtons = "";
      qList.forEach(function(item, i) {
        const hasAns = session.answers[item.id] !== undefined && session.answers[item.id] !== null && String(session.answers[item.id]).trim() !== "";

        let cls = "q-num-btn";
        if (isFlg) cls += " flagged";

        if (i === idx) cls += " current";
        navGridButtons += '<button type="button" class="' + cls + '" onclick="jumpToQuestion(' + i + ')" title="Soal No. ' + (i + 1) + ' (' + item.type + ')">' + (i + 1) + '</button>';

        '<div class="exam-header-bar">' +

        '    <div>' +
        '      <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--slate-300);">Sisa Waktu</div>' +
        '      <div id="examTimerDisplay" class="timer-digits">' + formatCountdown(remainingMs) + '</div>' +
        '    </div>' +
        '  </div>' +
        '</div>' +

        '<div class="exam-workspace">' +
        '  <div class="question-box">' +
        '    <div class="question-meta">' +
        '      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">' +
        '        <span class="badge badge-navy" style="font-size: 0.85rem; padding: 5px 12px;">SOAL NO. ' + (idx + 1) + ' DARI ' + qList.length + '</span>' +

        '      </div>' +

        '    </div>' +

        '    ' + answerInputHtml +

        '        &larr; Sebelumnya' +

        '      Kumpulkan & Selesai' +

    }

    async function selectPgAnswer(questionId, optionIdx) {
      if (!AppState.activeSession) return;
      AppState.activeSession.answers[questionId] = optionIdx;
      await OfflineDB.setState("activeSession", AppState.activeSession);
      renderCurrentPage();
    }

    let essaySaveDebounce = null;
    function saveEssayAnswer(questionId, textValue) {
      if (!AppState.activeSession) return;
      AppState.activeSession.answers[questionId] = textValue;
      clearTimeout(essaySaveDebounce);
      essaySaveDebounce = setTimeout(async function() {
        await OfflineDB.setState("activeSession", AppState.activeSession);
      }, 300);
    }

    async function toggleFlagQuestion(questionId) {
      if (!AppState.activeSession) return;
      AppState.activeSession.flagged[questionId] = !AppState.activeSession.flagged[questionId];
      await OfflineDB.setState("activeSession", AppState.activeSession);
      renderCurrentPage();
    }

    function jumpToQuestion(targetIndex) {
      if (targetIndex >= 0 && targetIndex < AppState.questions.length) {
        AppState.currentQuestionIdx = targetIndex;
        renderCurrentPage();
      }
    }

      AppState.examStep = 4;
      renderCurrentPage();

    async function finalizeExamSubmission(isAutoTimeout) {
      const session = AppState.activeSession;
      if (!session) return;

      if (AppState.timerInterval) clearInterval(AppState.timerInterval);
      hideExamLockOverlay();

      const s = AppState.settings;
      const finishedAt = new Date().toISOString();
      const durationSpentSec = Math.max(1, Math.round((new Date(finishedAt) - new Date(session.startedAt)) / 1000));

      let pgCorrect = 0;
      let pgTotal = 0;
      let essayTotal = 0;

      AppState.questions.forEach(function(q) {
        if (q.type === "PG") {
          pgTotal++;
          if (session.answers[q.id] === q.answerIndex) {
            pgCorrect++;
          }
        } else if (q.type === "ESSAY") {
          essayTotal++;
        }
      });

      const pgScore = pgCorrect * s.pgPointsPerItem;
      const essayScores = {};
      AppState.questions.forEach(function(q) {
        if (q.type === "ESSAY") essayScores[q.id] = 0;
      });

      session.activityLogs.push("[" + new Date().toLocaleTimeString("id-ID") + "] Ujian selesai (" + (isAutoTimeout ? "Waktu Habis Otomatis" : "Dikumpulkan Peserta") + ").");

      const submissionRecord = {
        id: "SUB-" + Date.now(),
        student: session.student,
        answers: session.answers,
        pgCorrect: pgCorrect,
        pgTotal: pgTotal,
        pgScore: pgScore,
        essayScores: essayScores,
        essayScore: 0,
        finalScore: pgScore,
        isEssayGraded: essayTotal === 0,
        isValidatedByTeacher: false,
        allowRetake: false,
        startedAt: session.startedAt,
        finishedAt: finishedAt,
        durationSpentSec: durationSpentSec,
        tabSwitchCount: session.tabSwitchCount || 0,
        activityLogs: session.activityLogs
      };

      await OfflineDB.saveSubmission(submissionRecord);
      AppState.submissions = await OfflineDB.getAllSubmissions();

      session.status = "completed";
      await OfflineDB.setState("activeSession", null);
      AppState.activeSession = null;
      AppState.lastCompletedSubmission = submissionRecord;
      AppState.examStep = 5;
      renderCurrentPage();
      showToast("Jawaban ujian berhasil disimpan ke database lokal!", "success");
    }

    function exportResultsToCSV() {
      const s = AppState.settings;
      const kktpVal = Number(s.kktp) || 75;
      if (AppState.submissions.length === 0) {
        showToast("Belum ada data peserta untuk diekspor.", "warning");
        return;
      }

      const headers = ["No", "Nama Lengkap", "NIS/NISN", "Nomor Peserta", "Kelas", "Nilai PG", "Nilai Essay", "Nilai Akhir", "KKTP", "Keterangan", "Predikat", "Status Validasi", "Waktu Pengerjaan"];
      const rows = AppState.submissions.map(function(sub, i) {
        const pred = getPredicate(sub.finalScore, kktpVal);
        const ketKktp = sub.finalScore >= kktpVal ? "Tuntas" : "Belum Tuntas";
        return [
          i + 1,
          '"' + sub.student.fullName.replace(/"/g, '""') + '"',
          '"' + sub.student.nisn + '"',
          '"' + sub.student.participantNumber + '"',
          '"' + sub.student.className + '"',
          sub.pgScore,
          sub.essayScore,
          sub.finalScore,
          kktpVal,
          '"' + ketKktp + '"',
          '"' + pred.letter + ' - ' + pred.label + '"',
          sub.isValidatedByTeacher ? "Valid" : "Belum Valid",
          '"' + formatDurationSeconds(sub.durationSpentSec) + '"'
        ].join(",");
      });

      const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Rekap_Nilai_SAS_NKPI_" + s.schoolName.replace(/\s+/g, "_") + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("File rekap nilai CSV berhasil diunduh.", "success");
    }

    function renderTeacherOverviewTab() {

      let passedCount = 0;
      AppState.submissions.forEach(function(sub) {
        const p = getPredicate(sub.finalScore, kktpVal);
        buckets[p.letter]++;
        if (sub.finalScore >= kktpVal) passedCount++;

      const maxBucket = Math.max(1, buckets.A, buckets.B, buckets.C, buckets.D);

      const barChartHtml = [
        { label: "Predikat A (90–100) • Sangat Baik", count: buckets.A, color: "var(--success-600)" },
        { label: "Predikat B (83–89) • Baik (Tuntas)", count: buckets.B, color: "var(--sea-600)" },

          '    <div style="font-size: 0.88rem; color: var(--slate-900); white-space: pre-wrap;">' + studentAns + '</div>' +

          '    <strong>Pedoman Kunci Jawaban:</strong><br>' + escapeHTML(q.answerKey).replace(/\n/g, "<br>") +

          '    <strong>Rubrik Penilaian (0–' + maxPerEssay + '):</strong><br>' + escapeHTML(q.rubric).replace(/\n/g, "<br>") +
          '  </div>' +
          '  <div style="display: flex; align-items: center; gap: 10px;">' +
          '    <label class="form-label" style="margin: 0;" for="scoreEssay_' + q.id + '">Skor Diberikan (0 – ' + maxPerEssay + '):</label>' +
          '    <input type="number" id="scoreEssay_' + q.id + '" class="form-control" style="width: 110px;" min="0" max="' + maxPerEssay + '" step="0.5" value="' + currentScore + '" />' +
          '  </div>' +
          '</div>';
      });

      openModal(
        "Koreksi Jawaban Essay: " + escapeHTML(sub.student.fullName),
        formItems,
        '<button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>' +

        true
      );
    }

    async function saveEssayGrades(subId) {
      const sub = AppState.submissions.find(function(x) { return x.id === subId; });
      if (!sub) return;

      const maxPerEssay = AppState.settings.essayMaxPointsPerItem;
      const essayQuestions = AppState.questions.filter(function(q) { return q.type === "ESSAY"; });
      let totalEssayScore = 0;

      essayQuestions.forEach(function(q) {
        const inp = document.getElementById("scoreEssay_" + q.id);
        let val = inp ? parseFloat(inp.value) : 0;
        if (isNaN(val) || val < 0) val = 0;
        if (val > maxPerEssay) val = maxPerEssay;
        sub.essayScores[q.id] = val;
        totalEssayScore += val;
      });

      sub.essayScore = Math.round(totalEssayScore * 10) / 10;
      sub.finalScore = Math.round((sub.pgScore + sub.essayScore) * 10) / 10;
      sub.isEssayGraded = true;

      await OfflineDB.saveSubmission(sub);
      AppState.submissions = await OfflineDB.getAllSubmissions();
      closeModal();
      renderCurrentPage();
      showToast("Skor essay disimpan. Nilai Akhir peserta: " + sub.finalScore, "success");
    }

    async function toggleValidateSubmission(subId) {
      const sub = AppState.submissions.find(function(x) { return x.id === subId; });
      if (!sub) return;
      sub.isValidatedByTeacher = !sub.isValidatedByTeacher;
      await OfflineDB.saveSubmission(sub);
      AppState.submissions = await OfflineDB.getAllSubmissions();
      renderCurrentPage();
      showToast(sub.isValidatedByTeacher ? "Nilai divalidasi. Sertifikat peserta kini aktif!" : "Validasi nilai dibatalkan.", "success");
    }

    async function saveEditedQuestion(e, idx) {
      e.preventDefault();
      const type = document.getElementById("qeType").value;
      const tp = parseInt(document.getElementById("qeTp").value, 10);
      const level = parseInt(document.getElementById("qeLevel").value, 10);
      const scopeMap = {
        1: "A. Faktor-Faktor Olah Gerak Kapal",
        2: "B. Olah Gerak Sandar, Lepas, Perairan Sempit & Jangkar",
        3: "C. Penyelamatan Orang Jatuh di Laut (Man Overboard / MOB)",
        4: "D. Olah Gerak Kapal Saat Setting dan Hauling",
        5: "E. Prinsip Dasar dan Karakteristik Kapal Perikanan"
      };

      const item = {
        id: idx >= 0 ? AppState.questions[idx].id : Date.now(),
        type: type,
        tp: tp,
        scope: scopeMap[tp],
        material: document.getElementById("qeMaterial").value.trim(),
        level: level,
        indicator: document.getElementById("qeIndicator").value.trim(),
        question: document.getElementById("qeQuestion").value.trim()
      };

      if (type === "PG") {
        item.options = [
          document.getElementById("qeOpt0").value.trim(),
          document.getElementById("qeOpt1").value.trim(),
          document.getElementById("qeOpt2").value.trim(),
          document.getElementById("qeOpt3").value.trim(),
          document.getElementById("qeOpt4").value.trim()
        ];
        item.answerIndex = parseInt(document.getElementById("qeAnsIdx").value, 10);
      } else {
        item.answerKey = document.getElementById("qeAnswerKey").value.trim();
        item.rubric = document.getElementById("qeRubric").value.trim();
      }

      if (idx >= 0) {
        AppState.questions[idx] = item;
      } else {
        AppState.questions.push(item);
      }

      await OfflineDB.setState("questions", AppState.questions);
      closeModal();
      updateHeaderAndSidebarUI();
      renderCurrentPage();
      showToast("Perubahan bank soal berhasil disimpan.", "success");
    }

    function deleteQuestionAt(idx) {
      showConfirmModal("Hapus Butir Soal", "Apakah Anda yakin ingin menghapus soal nomor " + (idx + 1) + "?", async function() {

    async function saveStudentRoster() {
      const raw = document.getElementById("admRosterInput").value.trim();
      if (!raw) {
        AppState.registeredStudents = [];
        await OfflineDB.setState("registeredStudents", []);
        showToast("Daftar peserta dikosongkan (akses terbuka untuk semua peserta).", "success");
        return;
      }

      const lines = raw.split("\n").map(function(l) { return l.trim(); }).filter(Boolean);
      const parsed = lines.map(function(line) {
        const parts = line.split("|").map(function(p) { return p.trim(); });
        return {
          participantNumber: parts[0] || "",
          nisn: parts[1] || "",
          fullName: parts[2] || "",
          className: parts[3] || AppState.settings.className
        };
      }).filter(function(st) { return st.participantNumber && st.fullName; });

      AppState.registeredStudents = parsed;
      await OfflineDB.setState("registeredStudents", parsed);
      showToast(parsed.length + " peserta berhasil disimpan ke daftar peserta resmi.", "success");
    }

    async function toggleAllowRetake(subId) {
      const sub = AppState.submissions.find(function(x) { return x.id === subId; });
      if (!sub) return;
      sub.allowRetake = !sub.allowRetake;
      await OfflineDB.saveSubmission(sub);
      AppState.submissions = await OfflineDB.getAllSubmissions();
      renderCurrentPage();
      showToast(sub.allowRetake ? "Izin mengulang ujian diaktifkan untuk peserta tersebut." : "Izin mengulang dikunci kembali.", "success");
    }

    function deleteSubmissionRecord(subId) {
      showConfirmModal("Hapus Data Hasil Peserta", "Data hasil ujian peserta ini akan dihapus permanen dari penyimpanan lokal. Lanjutkan?", async function() {
        await OfflineDB.deleteSubmission(subId);
        AppState.submissions = await OfflineDB.getAllSubmissions();
        renderCurrentPage();
        showToast("Data hasil peserta berhasil dihapus.", "warning");
      });
    }

    function exportFullBackupJSON() {
      const payload = {
        exportedAt: new Date().toISOString(),
        app: "SAS_GANJIL_NKPI_SMK_WALIWA_LAIMU_2026",
        settings: AppState.settings,
        questions: AppState.questions,
        submissions: AppState.submissions
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Backup_SAS_NKPI_" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("File backup & sinkronisasi JSON berhasil diunduh.", "success");
    }

    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data.submissions)) {
            let added = 0;
            for (let i = 0; i < data.submissions.length; i++) {
              const sub = data.submissions[i];
              if (sub && sub.id && sub.student) {
                await OfflineDB.saveSubmission(sub);
                added++;
              }
            }
            AppState.submissions = await OfflineDB.getAllSubmissions();
            renderCurrentPage();
            showToast("Berhasil mengimpor & menggabungkan " + added + " data peserta.", "success");
          } else {
            showToast("Format file JSON tidak valid.", "danger");
          }
        } catch (err) {
          showToast("Gagal membaca file JSON.", "danger");
        }
      };
      reader.readAsText(file);
    }

    /* ========================================================================
       L. UTILITAS HELPER, MODAL & TOAST
       ======================================================================== */
    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatCountdown(ms) {
      const totalSec = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = function(n) { return String(n).padStart(2, "0"); };
      return pad(hrs) + ":" + pad(mins) + ":" + pad(secs);
    }

    function formatDurationSeconds(sec) {
      const m = Math.floor((sec || 0) / 60);
      const s = (sec || 0) % 60;
      return m + " mnt " + s + " dtk";
    }

    function getPredicate(score, kktp) {
      const batasTuntas = Number(kktp) || 75;
      if (score >= 90) return { letter: "A", label: "Sangat Baik (Tuntas)" };
      if (score >= 83) return { letter: "B", label: "Baik (Tuntas)" };
      if (score >= batasTuntas) return { letter: "C", label: "Cukup (Tuntas KKTP)" };
      return { letter: "D", label: "Perlu Bimbingan (< KKTP " + batasTuntas + ")" };
    }

    function openModal(title, bodyHtml, footerHtml, isLarge) {
      const backdrop = document.getElementById("customModalBackdrop");
      const dialog = document.getElementById("customModalDialog");
      document.getElementById("customModalTitle").textContent = title;
      document.getElementById("customModalBody").innerHTML = bodyHtml;
      document.getElementById("customModalFooter").innerHTML = footerHtml || "";
      if (isLarge) dialog.classList.add("modal-lg");
      else dialog.classList.remove("modal-lg");
      backdrop.classList.add("open");
    }

    function closeModal() {
      document.getElementById("customModalBackdrop").classList.remove("open");
    }

    function showConfirmModal(title, message, onConfirm) {
      const bodyHtml = '<p style="color: var(--slate-700); line-height: 1.6;">' + escapeHTML(message) + '</p>';
      const footerHtml = '' +
        '<button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>' +
        '<button type="button" id="confirmModalYesBtn" class="btn btn-navy">Ya, Lanjutkan</button>';
      openModal(title, bodyHtml, footerHtml, false);
      setTimeout(function() {
        const yesBtn = document.getElementById("confirmModalYesBtn");
        if (yesBtn) {
          yesBtn.onclick = function() {
            closeModal();
            onConfirm();
          };
        }
      }, 30);
    }

    function showToast(message, type) {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      const toast = document.createElement("div");
      toast.className = "toast " + (type || "");
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 4200);
    }

    window.navigateTo = navigateTo;
    window.toggleMobileSidebar = toggleMobileSidebar;
    window.handleTeacherAuthToggle = handleTeacherAuthToggle;
    window.verifyTeacherPin = verifyTeacherPin;
    window.closeModal = closeModal;
    window.submitStudentIdentity = submitStudentIdentity;
    window.beginActiveExam = beginActiveExam;
    window.acknowledgeSingleExamWarning = acknowledgeSingleExamWarning;
    window.unlockExamScreenByTeacher = unlockExamScreenByTeacher;
    window.selectPgAnswer = selectPgAnswer;
    window.saveEssayAnswer = saveEssayAnswer;
    window.toggleFlagQuestion = toggleFlagQuestion;
    window.jumpToQuestion = jumpToQuestion;
    window.goToFinishConfirmation = goToFinishConfirmation;
    window.finalizeExamSubmission = finalizeExamSubmission;
    window.renderHasil = renderHasil;
    window.viewSubmissionDetail = viewSubmissionDetail;
    window.exportResultsToCSV = exportResultsToCSV;
    window.openCertificateFor = openCertificateFor;
    window.switchTeacherTab = switchTeacherTab;
    window.openEssayGradingModal = openEssayGradingModal;
    window.saveEssayGrades = saveEssayGrades;
    window.toggleValidateSubmission = toggleValidateSubmission;
    window.openQuestionEditorModal = openQuestionEditorModal;
    window.toggleQeTypeFields = toggleQeTypeFields;
    window.saveEditedQuestion = saveEditedQuestion;
    window.deleteQuestionAt = deleteQuestionAt;
    window.resetQuestionsToDefault = resetQuestionsToDefault;
    window.saveAdminSettings = saveAdminSettings;
    window.saveStudentRoster = saveStudentRoster;
    window.toggleAllowRetake = toggleAllowRetake;
    window.deleteSubmissionRecord = deleteSubmissionRecord;
    window.exportFullBackupJSON = exportFullBackupJSON;
    window.importBackupJSON = importBackupJSON;

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
